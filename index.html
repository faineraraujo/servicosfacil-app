</head>
<body>
<title>ServiçosFácil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Tokens no espírito Tailwind/shadcn (gray + blue-600) */
  :root {
    --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB; --gray-300: #D1D5DB; --gray-400: #9CA3AF;
    --gray-500: #6B7280; --gray-600: #4B5563; --gray-700: #374151; --gray-900: #111827;
    --white: #FFFFFF; --white-90: rgba(255,255,255,.9);
    --blue-50: #EFF6FF; --blue-200: #BFDBFE; --blue-600: #2563EB; --blue-700: #1D4ED8; --blue-800: #1E40AF; --blue-900: #1E3A8A;
    --yellow-400: #FACC15; --green-600: #16A34A; --green-50: #F0FDF4; --green-200: #BBF7D0; --green-700: #15803D;
    --amber-50: #FFFBEB; --amber-200: #FDE68A; --amber-700: #B45309;
    --red-50: #FEF2F2; --red-200: #FECACA; --red-600: #DC2626; --red-700: #B91C1C;
    --overlay: rgba(0,0,0,.8);
    --ring: rgba(37,99,235,.35);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --gray-50: #09090B; --gray-100: #18181B; --gray-200: #27272A; --gray-300: #3F3F46; --gray-400: #71717A;
      --gray-500: #A1A1AA; --gray-600: #C4C4CC; --gray-700: #D4D4D8; --gray-900: #FAFAFA;
      --white: #121215; --white-90: rgba(18,18,21,.9);
      --blue-50: #172554; --blue-200: #1E3A8A; --blue-900: #DBEAFE; --blue-800: #BFDBFE;
      --green-50: #052E16; --green-200: #14532D; --green-700: #86EFAC;
      --amber-50: #451A03; --amber-200: #78350F; --amber-700: #FCD34D;
      --red-50: #450A0A; --red-200: #7F1D1D; --red-700: #FCA5A5;
      --overlay: rgba(0,0,0,.85);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --gray-50: #09090B; --gray-100: #18181B; --gray-200: #27272A; --gray-300: #3F3F46; --gray-400: #71717A;
    --gray-500: #A1A1AA; --gray-600: #C4C4CC; --gray-700: #D4D4D8; --gray-900: #FAFAFA;
    --white: #121215; --white-90: rgba(18,18,21,.9);
    --blue-50: #172554; --blue-200: #1E3A8A; --blue-900: #DBEAFE; --blue-800: #BFDBFE;
    --green-50: #052E16; --green-200: #14532D; --green-700: #86EFAC;
    --amber-50: #451A03; --amber-200: #78350F; --amber-700: #FCD34D;
    --red-50: #450A0A; --red-200: #7F1D1D; --red-700: #FCA5A5;
    --overlay: rgba(0,0,0,.85);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--gray-50); color: var(--gray-900); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue-600); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; flex-shrink: 0; }
  .i-3 { width: 12px; height: 12px; } .i-5 { width: 20px; height: 20px; }
  .tnum { font-variant-numeric: tabular-nums; }

  .container { max-width: 1280px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
  @media (min-width: 640px) { .container { padding-left: 24px; padding-right: 24px; } }
  @media (min-width: 1024px) { .container { padding-left: 32px; padding-right: 32px; } }

  /* Header */
  header { background: var(--white); border-bottom: 1px solid var(--gray-200); }
  .hdr { padding-top: 16px; padding-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-mark { width: 32px; height: 32px; background: var(--blue-600); border-radius: 8px; display: grid; place-items: center; color: #fff; }
  .logo h1 { font-size: 20px; font-weight: 600; color: var(--gray-900); }
  .hdr-actions { display: flex; gap: 8px; }

  /* Buttons (shadcn) */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; border-radius: 6px; font-weight: 500; font-size: 14px; height: 40px; padding: 0 16px; border: 1px solid transparent; transition: background .15s, color .15s, box-shadow .15s; }
  .btn.sm { height: 36px; padding: 0 12px; font-size: 13px; }
  .btn.xs { font-size: 12px; }
  .btn.primary { background: var(--blue-600); color: #fff; }
  .btn.primary:hover { background: var(--blue-700); }
  .btn.outline { background: var(--white); border-color: var(--gray-200); color: var(--gray-600); }
  .btn.outline:hover { background: var(--gray-50); }
  .btn.ghost { background: transparent; color: var(--gray-600); }
  .btn.ghost:hover { background: var(--gray-100); }
  .btn.danger { background: var(--red-50); border-color: var(--red-200); color: var(--red-700); }
  .btn.success { background: var(--green-50); border-color: var(--green-200); color: var(--green-700); }
  .btn.flex1 { flex: 1; }
  .btn.w-full { width: 100%; }
  .btn:disabled { opacity: .5; pointer-events: none; }

  /* Category tabs */
  .tabs-list { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 4px; background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px; margin-bottom: 24px; }
  @media (min-width: 1024px) { .tabs-list { grid-template-columns: repeat(14, 1fr); } }
  .tab-trigger { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px; font-size: 12px; font-weight: 500; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--gray-700); transition: background .15s, color .15s; min-width: 0; }
  .tab-trigger:hover { background: var(--gray-50); }
  .tab-trigger[data-state="active"] { background: var(--blue-50); color: var(--blue-600); border-color: var(--blue-200); }
  .tab-trigger span { display: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  @media (min-width: 640px) { .tab-trigger span { display: block; } }
  .tab-trigger svg { width: 20px; height: 20px; }

  /* Filters */
  .filters { background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px; padding: 16px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px; }
  @media (min-width: 1024px) { .filters { flex-direction: row; } }
  .search { position: relative; flex: 1; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); width: 16px; height: 16px; }
  .input { display: block; width: 100%; height: 40px; border: 1px solid var(--gray-200); background: var(--white); border-radius: 6px; padding: 0 12px; font-size: 14px; }
  .input:focus { border-color: var(--blue-600); box-shadow: 0 0 0 1px var(--blue-600); outline: none; }
  .search .input { padding-left: 40px; }
  .input::placeholder { color: var(--gray-500); }
  textarea.input { height: auto; padding: 8px 12px; min-height: 80px; resize: vertical; }
  .sel-wrap { position: relative; width: 192px; }
  .sel-wrap > svg.lead { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-400); pointer-events: none; }
  .sel-wrap > svg.chev { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--gray-500); opacity: .6; pointer-events: none; }
  .sel-wrap select { appearance: none; -webkit-appearance: none; padding-left: 36px; padding-right: 32px; cursor: pointer; }
  .sel-wrap.plain select { padding-left: 12px; }
  .sel-wrap.combo input { padding-left: 36px; padding-right: 32px; }
  .sel-wrap.combo > svg.chev { pointer-events: auto; cursor: pointer; }
  .dd { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--white); border: 1px solid var(--gray-200); border-radius: 6px; box-shadow: var(--shadow-md); z-index: 30; max-height: 280px; overflow: auto; padding: 4px; }
  .dd button { display: flex; width: 100%; text-align: left; padding: 6px 8px; border: 0; background: transparent; border-radius: 4px; font-size: 14px; color: var(--gray-900); }
  .dd button:hover, .dd button[aria-selected="true"] { background: var(--blue-50); color: var(--blue-600); }
  .dd .dd-empty { padding: 8px; font-size: 13px; color: var(--gray-500); }
  .filter-row { display: flex; gap: 12px; }
  .hdr-actions .btn span.badge { padding: 0 6px; }
  @media (max-width: 640px) { .hdr-actions .btn { padding: 0 10px; } .hdr-actions .btn .lbl { display: none; } }

  /* Agenda */
  .cal-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cal-h b { font-size: 16px; font-weight: 600; text-transform: capitalize; }
  .cal-nav { display: flex; gap: 4px; }
  .cal-nav button { width: 32px; height: 32px; border: 1px solid var(--gray-200); background: var(--white); border-radius: 6px; display: grid; place-items: center; color: var(--gray-600); }
  .cal-nav button:hover { background: var(--gray-50); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal .wd { text-align: center; font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; padding: 4px 0; }
  .day { position: relative; aspect-ratio: 1; min-height: 44px; border: 1px solid var(--gray-200); background: var(--white); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; color: var(--gray-900); padding: 2px; }
  .day:hover { background: var(--gray-50); }
  .day.pad { visibility: hidden; }
  .day.past { color: var(--gray-400); }
  .day.today { border-color: var(--blue-600); font-weight: 600; }
  .day[aria-pressed="true"] { background: var(--blue-600); border-color: var(--blue-600); color: #fff; }
  .day.blocked { background: repeating-linear-gradient(135deg, var(--gray-100) 0 4px, var(--white) 4px 8px); color: var(--gray-400); text-decoration: line-through; }
  .day[aria-pressed="true"].blocked { color: #fff; background: var(--gray-500); border-color: var(--gray-500); }
  .day .cnt { font-size: 10px; line-height: 14px; min-width: 16px; padding: 0 4px; border-radius: 999px; background: var(--blue-50); color: var(--blue-600); font-weight: 600; }
  .day[aria-pressed="true"] .cnt { background: rgba(255,255,255,.25); color: #fff; }
  .day .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green-600); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--gray-500); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--gray-200); display: inline-block; }
  .day-panel { border: 1px solid var(--gray-200); border-radius: 8px; padding: 12px; }
  .day-panel .dp-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .day-panel .dp-h b { font-weight: 600; text-transform: capitalize; }
  .slot-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; }
  .slot-row + .slot-row { border-top: 1px solid var(--gray-200); }
  .slot-row .t { font-weight: 600; font-size: 13px; }
  .slot-row .sub { font-size: 12px; color: var(--gray-500); }
  .slot-row .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .slot-row .acts .btn { height: 30px; padding: 0 10px; font-size: 12px; }
  @media (max-width: 480px) { .filter-row { flex-direction: column; } .sel-wrap { width: 100%; } }

  .results { font-size: 14px; color: var(--gray-600); margin-bottom: 16px; }

  /* Grid & cards */
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1280px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .card { background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px; overflow: hidden; transition: box-shadow .2s; display: flex; flex-direction: column; }
  .card:hover { box-shadow: var(--shadow-md); }
  .cover { position: relative; height: 160px; display: grid; place-items: center; color: #fff; }
  .cover svg { width: 56px; height: 56px; opacity: .9; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover.lg { overflow: hidden; }
  .card .cover img { transition: transform .2s; }
  .card:hover .cover img { transform: scale(1.03); }
  .cover.lg { height: 192px; border-radius: 8px; }
  .cover .badge { position: absolute; top: 8px; right: 8px; }
  .badge { display: inline-flex; align-items: center; border-radius: 9999px; padding: 2px 10px; font-size: 12px; font-weight: 600; line-height: 16px; white-space: nowrap; }
  .badge.secondary { background: var(--white-90); color: var(--gray-700); }
  .badge.outline { border: 1px solid var(--gray-200); color: var(--gray-600); background: transparent; }
  .badge.blue { background: var(--blue-50); color: var(--blue-600); border: 1px solid var(--blue-200); }
  .badge.green { background: var(--green-50); color: var(--green-700); border: 1px solid var(--green-200); }
  .badge.amber { background: var(--amber-50); color: var(--amber-700); border: 1px solid var(--amber-200); }
  .badge.red { background: var(--red-50); color: var(--red-700); border: 1px solid var(--red-200); }
  .card-body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .price { font-size: 18px; font-weight: 600; color: var(--gray-900); }
  .card h3 { font-size: 14px; font-weight: 500; color: var(--gray-900); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; font-size: 12px; color: var(--gray-600); }
  .meta svg { width: 12px; height: 12px; color: var(--gray-400); }
  .meta.loc { color: var(--gray-500); }
  .meta.rate { margin-bottom: 12px; }
  .meta.rate svg { color: var(--yellow-400); fill: var(--yellow-400); }
  .meta.rate b { font-weight: 500; color: var(--gray-700); }
  .meta.rate span { color: var(--gray-500); }
  .card-actions { display: flex; gap: 8px; margin-top: auto; }

  .empty { text-align: center; padding: 48px 0; }
  .empty .ico { font-size: 36px; color: var(--gray-400); margin-bottom: 16px; }
  .empty h3 { font-size: 18px; font-weight: 500; color: var(--gray-600); margin-bottom: 8px; }
  .empty p { color: var(--gray-500); }

  /* Dialog (shadcn) */
  .overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 50; display: grid; place-items: center; padding: 16px; overflow: auto; }
  .dialog { background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px; box-shadow: var(--shadow-lg); width: 100%; max-width: 672px; padding: 24px; position: relative; display: flex; flex-direction: column; gap: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  .dialog.sm { max-width: 480px; }
  .dialog-title { font-size: 20px; font-weight: 600; color: var(--gray-900); padding-right: 32px; }
  .dialog-close { position: absolute; top: 16px; right: 16px; border: 0; background: transparent; color: var(--gray-500); opacity: .7; border-radius: 4px; padding: 2px; display: grid; }
  .dialog-close:hover { opacity: 1; }
  .space-y > * + * { margin-top: 16px; }
  .cols-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 768px) { .cols-2 { grid-template-columns: 1fr 1fr; } }
  .sect h3 { font-weight: 500; color: var(--gray-900); margin-bottom: 8px; font-size: 14px; }
  .lines > * + * { margin-top: 4px; }
  .line { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .line svg { color: var(--gray-400); }
  .line.star svg { color: var(--yellow-400); fill: var(--yellow-400); }
  .line.money svg, .line.money b { color: var(--green-600); }
  .line.money b { font-size: 18px; font-weight: 600; }
  .desc { font-size: 14px; color: var(--gray-600); }
  .info-box { background: var(--blue-50); border: 1px solid var(--blue-200); border-radius: 8px; padding: 12px; }
  .info-box h3 { font-weight: 500; color: var(--blue-900); margin-bottom: 4px; font-size: 14px; }
  .info-box p { font-size: 14px; color: var(--blue-800); }
  .label { display: block; font-size: 14px; font-weight: 500; color: var(--gray-700); margin-bottom: 4px; }
  .field .input, .field .sel-wrap { margin-top: 4px; }
  .field .sel-wrap { width: 100%; }
  .form-actions { display: flex; gap: 12px; padding-top: 16px; }
  .err { color: var(--red-600); font-size: 13px; }

  /* Reviews */
  .rv { padding: 12px 0; border-top: 1px solid var(--gray-200); }
  .rv-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
  .rv-h b { font-weight: 500; color: var(--gray-900); }
  .rv-h span { color: var(--gray-500); font-size: 12px; }
  .stars { display: inline-flex; gap: 2px; }
  .stars svg { width: 14px; height: 14px; color: var(--gray-300); }
  .stars svg.on { color: var(--yellow-400); fill: var(--yellow-400); }
  .star-pick { display: flex; justify-content: center; gap: 4px; }
  .star-pick button { border: 0; background: transparent; padding: 2px; color: var(--gray-300); }
  .star-pick button.on { color: var(--yellow-400); }
  .star-pick svg { width: 32px; height: 32px; fill: currentColor; }

  /* Payment */
  .pay-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--gray-100); border-radius: 6px; }
  .pay-tab { border: 0; background: transparent; border-radius: 4px; padding: 6px 12px; font-size: 14px; font-weight: 500; color: var(--gray-500); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .pay-tab[data-state="active"] { background: var(--white); color: var(--gray-900); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .qr { display: grid; place-items: center; gap: 8px; }
  .qr canvas { width: 160px; height: 160px; background: #fff; border: 8px solid #fff; border-radius: 6px; image-rendering: pixelated; }
  .code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; word-break: break-all; background: var(--gray-100); padding: 8px 10px; border-radius: 6px; color: var(--gray-600); }
  .note { background: var(--amber-50); border: 1px solid var(--amber-200); color: var(--amber-700); border-radius: 6px; padding: 8px 12px; font-size: 13px; }
  .sum { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
  .sum .k { color: var(--gray-500); }
  .sum .t { border-top: 1px solid var(--gray-200); padding-top: 8px; margin-top: 4px; font-weight: 600; font-size: 16px; }
  .done { text-align: center; padding: 8px 0; }
  .done .ico { width: 56px; height: 56px; border-radius: 50%; background: var(--green-50); color: var(--green-600); display: grid; place-items: center; margin: 0 auto 12px; }
  .done .ico svg { width: 28px; height: 28px; }
  .spin { width: 20px; height: 20px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* Orders */
  .seg-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--gray-100); border-radius: 6px; }
  .order { border: 1px solid var(--gray-200); border-radius: 8px; padding: 12px; }
  .order + .order { margin-top: 8px; }
  .order-h { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .order-h b { font-weight: 500; }
  .order .sub { font-size: 12px; color: var(--gray-500); margin-top: 2px; }
  .order .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    .tabbar button { position: relative; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; font-size: 11px; font-weight: 500; color: var(--gray-500); border-radius: 8px; }

    .tabbar button.cta svg { width: 40px; height: 40px; padding: 9px; background: var(--blue-600); color: #fff; border-radius: 12px; margin-top: -14px; box-shadow: var(--shadow-md); }

/* Helpers */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const money = v => brl.format(v || 0);
const rs = v => 'R$ ' + (Number.isInteger(v) ? v : v.toFixed(2).replace('.', ','));

const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const fmtWhen = ts => { const d = new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`; };
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const MONTHS = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const WEEKDAYS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtLong = s => { const d = parseISO(s); return `${WEEKDAYS[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
const allLocations = () => { const set = new Set(LOCATIONS.slice(1)); Object.values(state.services).forEach(s => s.location && set.add(s.location)); return [...set]; };
const myAgenda = () => state.agenda[state.me.uid] || { id: state.me.uid, blocked: [] };
const isBlocked = (uid, date) => !!(state.agenda[uid] && (state.agenda[uid].blocked || []).includes(date));
const catOf = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[0];
const CAT_IMAGE = {};
function imageOf(s) {
  if (IMAGES[s.id]) return IMAGES[s.id];
  if (!CAT_IMAGE[s.category]) { const o = Object.values(state.services).find(x => x.category === s.category && IMAGES[x.id]); CAT_IMAGE[s.category] = o ? IMAGES[o.id] : null; }
  return CAT_IMAGE[s.category];
}
const cover = (s, cls = '') => {
  const c = catOf(s.category); const src = imageOf(s);
  const inner = src ? `<img src="${src}" alt="${esc(s.title)}" loading="lazy">` : I[c.icon];
  return `<div class="cover ${cls}" style="background:linear-gradient(135deg,hsl(${c.hue} 55% 58%),hsl(${c.hue + 20} 50% 40%))">${inner}${cls ? '' : `<span class="badge secondary">${esc(s.availability)}</span>`}</div>`;
};
const starsHTML = n => `<span class="stars" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => I.star.replace('class="i"', `class="i ${i <= Math.round(n) ? 'on' : ''}"`)).join('')}</span>`;
function ratingOf(s) {
  const extra = Object.values(state.reviews).filter(r => r.serviceId === s.id);
  const count = (s.reviews || 0) + extra.length;
  const sum = (s.rating || 0) * (s.reviews || 0) + extra.reduce((a, r) => a + r.stars, 0);
  return { avg: count ? sum / count : 0, count };
}

/* Estado e persistência */
const state = { mode: 'loading', me: null, q: '', cat: 'Todos', loc: '', price: 'Todos', dialog: null, services: {}, requests: {}, reviews: {}, agenda: {} };
let db = null;
const LS_KEY = 'servicosfacil.store.v1';
function loadMe() { try { const m = JSON.parse(localStorage.getItem('servicosfacil.me') || 'null'); if (m && m.uid) return m; } catch {} const m = { uid: uid('u'), name: '', phone: '', email: '' }; saveMe(m); return m; }
function saveMe(m) { state.me = m; try { localStorage.setItem('servicosfacil.me', JSON.stringify(m)); } catch {} }
function localSave() { try { localStorage.setItem(LS_KEY, JSON.stringify({ services: state.services, requests: state.requests, reviews: state.reviews, agenda: state.agenda })); } catch {} }
async function put(col, doc) {
  state[col][doc.id] = doc; render();
  if (state.mode === 'db' && db) { try { await db.collection(col).doc(doc.id).set(doc); } catch (e) { toast('Não foi possível salvar: ' + (e.message || e.code)); } }
  else localSave();
}
async function boot() {
  state.me = loadMe(); renderStatic(); render();
  if (window.claude && typeof window.claude.use === 'function') { try { db = await window.claude.use('db'); } catch { db = null; } }
  if (db) {
    state.mode = 'db';
    for (const col of ['services', 'requests', 'reviews', 'agenda']) {
      db.collection(col).onSnapshot(snap => { const next = {}; snap.docs.forEach(d => { if (d.exists) next[d.id] = d.data(); }); state[col] = next; render(); }, () => {});
    }
  } else {
    state.mode = 'local';
    let s = null; try { s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch {}
    if (s) { state.services = s.services || {}; state.requests = s.requests || {}; state.reviews = s.reviews || {}; state.agenda = s.agenda || {}; }
    else { seedLocal(); localSave(); }
    render();
  }
}

function renderStatic() {

  $('#offerBtn').innerHTML = `${I.plus} <span class="lbl">Oferecer Serviço</span>`;
  $('#searchWrap').insertAdjacentHTML('afterbegin', I.search);

  $('#priceWrap').insertAdjacentHTML('afterbegin', I.dollar.replace('class="i"', 'class="i lead"'));
  $('#priceWrap').insertAdjacentHTML('beforeend', I.chevron.replace('class="i"', 'class="i chev"'));
}
function filtered() {
  const q = state.q.toLowerCase();
  return Object.values(state.services).filter(s => {
    const ms = s.title.toLowerCase().includes(q) || s.provider.toLowerCase().includes(q);
    const mc = state.cat === 'Todos' || s.category === state.cat;
    const ln = norm(state.loc);
    const ml = !ln || ln === 'todas' || norm(s.location).includes(ln);
    const p = state.price, v = s.price;
    const mp = p === 'Todos' || (p === '0-100' && v <= 100) || (p === '101-300' && v > 100 && v <= 300) || (p === '301-600' && v > 300 && v <= 600) || (p === '601+' && v > 600);
    return ms && mc && ml && mp;
  }).sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
}
function render() {
  $('#catTabs').innerHTML = CATEGORIES.map(c => `<button class="tab-trigger" role="tab" data-action="cat" data-cat="${c.id}" data-state="${state.cat === c.id ? 'active' : 'inactive'}" title="${c.name}">${I[c.icon]}<span>${c.name}</span></button>`).join('');

  if (state.mode === 'loading') { $('#results').textContent = 'Carregando serviços...'; $('#list').innerHTML = ''; }
  else {
    $('#results').textContent = `${list.length} serviços encontrados`;

  const pend = Object.values(state.requests).filter(r => r.providerUid === state.me.uid && r.status === 'aguardando').length;
  $('#ordersBtn').innerHTML = `${I.list} <span class="lbl">Meus pedidos</span>${pend ? ` <span class="badge blue">${pend}</span>` : ''}`;

function dlgAgenda(d) {

  const upcoming = mine.filter(r => r.date >= today && ['aguardando', 'confirmado'].includes(r.status)).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || ''))).slice(0, 5);

function drawQR(seed) {
  const c = $('#qrc'); if (!c) return;
  const ctx = c.getContext('2d'); const n = 29; let h = 7; for (const ch of String(seed)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { h = (h * 1103515245 + 12345) & 0x7fffffff; return h / 0x7fffffff; };
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, n, n); ctx.fillStyle = '#111';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const f = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9); if (!f && rnd() > 0.55) ctx.fillRect(x, y, 1, 1); }
  const finder = (x, y) => { ctx.fillStyle = '#111'; ctx.fillRect(x, y, 7, 7); ctx.fillStyle = '#fff'; ctx.fillRect(x + 1, y + 1, 5, 5); ctx.fillStyle = '#111'; ctx.fillRect(x + 2, y + 2, 3, 3); };
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
}
